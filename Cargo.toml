[workspace]
resolver = "2"
members = ["crates/*"]

[package]
name = "pockettrail-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Pure-Rust deps shared by native tests and the wasm runtime.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = { version = "3", features = ["serde", "json"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.21"
url = "2"
pockettrail-domain = { path = "crates/domain" }
pockettrail-jago-parser = { path = "crates/jago-parser" }

# Worker/bindings deps only build for the wasm target, so `cargo test`
# (native) skips them and tests the pure domain logic directly.

# Native SQLite for audit-trail SQL semantics tests (never compiled for wasm).
[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8.7", features = ["d1"] }
wasm-bindgen = "0.2.123"
js-sys = "0.3"
console_error_panic_hook = "0.1"
jsonwebtoken = "9"
getrandom = { version = "0.2", features = ["js"] }
tokio = { version = "1", default-features = false }

[profile.release]
opt-level = "s"
